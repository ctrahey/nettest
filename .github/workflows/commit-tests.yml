name: Run Tests on Commit

on:
  push:
    branches-ignore: []
  pull_request:
    branches-ignore: []

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
        
    - name: Install dependencies
      run: |
        cd www/app
        pip install --upgrade pip
        pip install -e ".[test]"
        
    - name: Run all tests
      run: |
        cd www/app
        python -m pytest tests/ -v --tb=short
        
    - name: Check code syntax
      run: |
        cd www/app
        python -m py_compile mockserver/**/*.py
        
    - name: Run with coverage
      run: |
        cd www/app
        python -m pytest tests/ --cov=mockserver --cov-report=term-missing
