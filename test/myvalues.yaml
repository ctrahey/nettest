image:
  repository: ctrahey/nettest
  pullPolicy: Always
  tag: "v0,0,7"

s3preloader:
  enabled: true
  image:
    repository: ctrahey/s3-preloader
    pullPolicy: Always
    tag: "0.0.1"
  configs:
    - mountPoint: /mnt/mocked-responses
      env:
        - name: MAX_FILES
          value: "100"
      secretName: mockserver-s3-preloader-config
      volumeName: preloaded-files

mock_endpoints:
  enabled: true
  config:
    redact_headers:
      - "Authorization"
    mock_server_configs:
      - methods:
          - GET
        mount_paths:
          - "/general/v0/general"
        source_files_directory: "/mnt/mocked-responses"
        error_probability: 0.0
        latency_median: 0.0
        latency_std_deviation: 0.0
        media_type: "application/pdf"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

service:
  type: ClusterIP
  port: 80

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}


