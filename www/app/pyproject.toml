[project]
name = "mockserver"
version = "0.1.0"
description = "A mock HTTP server"
dependencies = [
    "uvicorn",
    "fastapi",
    "python-multipart",
    "pydantic",
    "pyyaml"
]
authors = [
    {name = "Chris Trahey", email = "christrahey@gmail.com"}
]
maintainers = [
    {name = "Chris Trahey", email = "christrahey@gmail.com"}
]
readme = "README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mockserver"]