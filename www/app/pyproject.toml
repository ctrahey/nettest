[project]
name = "mockserver"
version = "0.1.0"
description = "A mock HTTP server"
dependencies = [
    "uvicorn",
    "fastapi",
    "python-multipart",
    "pydantic",
    "pyyaml"
]
authors = [
    {name = "Chris Trahey", email = "christrahey@gmail.com"}
]
maintainers = [
    {name = "Chris Trahey", email = "christrahey@gmail.com"}
]
readme = "README.md"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mockserver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"